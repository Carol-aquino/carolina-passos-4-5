<div class="login-container">

  <div class="login-card">

    <div class="text-center mb-4">
      <img src="/img/logo-ford-256.png" width="90" alt="Ford">
    </div>

    <h2>Ford Motors</h2>

    <p>Faça login para continuar</p>

    <div class="mb-3">
      <label for="usuario">Usuário</label>

      <input
        id="usuario"
        type="text"
        class="form-control"
        [(ngModel)]="usuario"
        name="usuario">
    </div>

    <div class="mb-3">
      <label for="senha">Senha</label>

      <input
        id="senha"
        type="password"
        class="form-control"
        [(ngModel)]="senha"
        name="senha">
    </div>

    <button
      class="btn btn-primary w-100"
      (click)="entrar()">

      Entrar

    </button>

  </div>

</div>
